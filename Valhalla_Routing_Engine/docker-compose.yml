version: '3.8'

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla_test
    ports:
      - "8002:8002"
    environment:
      - VALHALLA_AUTO_CONFIG=true
      - VALHALLA_LOGGING_LEVEL=DEBUG
    volumes:
      - ./osm:/custom_files
      - ./valhalla.json:/valhalla/valhalla.json
      - valhalla_tiles:/data/valhalla
    restart: unless-stopped

volumes:
  valhalla_tiles:
